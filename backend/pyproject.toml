[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docubot"
version = "0.1.0"
description = "Descubre, descarga y cataloga documentos públicos según perfiles configurables."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "typer>=0.13",
    "httpx>=0.27",
    "protego>=0.3",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "defusedxml>=0.7",
    "pypdf[crypto]>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "pgvector>=0.3",
    "fastembed>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1.post1",
]

[project.scripts]
docubot = "docubot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docubot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# E501: el formateador se encarga; B008: Depends() de FastAPI; E741: «l» de lugar en geo
ignore = ["E501", "B008", "E741"]

[tool.ruff.lint.per-file-ignores]
# los fixtures se importan de otros módulos de prueba y pytest los inyecta por nombre
"tests/*" = ["F401", "F811"]
