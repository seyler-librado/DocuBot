# DocuBot
#
#   cp .env.example .env          # y cambia la contraseña
#   docker compose up -d --build  # -> http://127.0.0.1:8080
#
# Pruebas:  docker compose --profile pruebas run --rm pruebas
#
# Lo que vive en esta máquina y se monta:
#   ./config    ajustes globales y perfiles (solo lectura)
#   ./almacen   los documentos descargados
#   la base de datos vive en el volumen "pgdata"

name: docubot

x-backend: &backend
  build:
    context: ./backend
    target: app
  image: docubot-backend:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DOCUBOT_BASE_DATOS_URL: postgresql+psycopg://docubot:${POSTGRES_PASSWORD:-docubot}@db:5432/docubot
    DOCUBOT_CONFIG: /app/config/docubot.yaml
    DOCUBOT_CARPETA_PERFILES: /app/config/perfiles
    DOCUBOT_CARPETA_EXTENSIONES: /app/config/extensiones
    DOCUBOT_ALMACEN__CARPETA: /datos/almacen
    TZ: ${TZ:-UTC}
  volumes:
    - ./config:/app/config:ro
    - ./almacen:/datos/almacen
    - modelos:/datos/modelos   # modelo de búsqueda por tema (se descarga una vez)

services:
  db:
    build:
      context: ./db
      args:
        APT_USER_AGENT: ${APT_USER_AGENT:-}
    image: docubot-db:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: docubot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docubot}
      POSTGRES_DB: docubot
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # solo en esta máquina, para conectarse con un cliente (DBeaver, psql...)
      - "127.0.0.1:${DB_PUERTO:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docubot -d docubot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica las migraciones y termina; api y worker esperan a que acabe.
  migrar:
    <<: *backend
    restart: "no"
    command: ["docubot", "migrar"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["docubot", "api", "--host", "0.0.0.0"]
    depends_on:
      migrar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *backend
    command: ["docubot", "worker"]
    stop_grace_period: 30s
    depends_on:
      migrar:
        condition: service_completed_successfully

  web:
    build: ./frontend
    image: docubot-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PUERTO:-8080}:80"
    depends_on:
      - api

  # Buscador propio (opcional): docker compose --profile searxng up -d
  # Sin llaves. Queda en http://127.0.0.1:${SEARXNG_PUERTO:-8888} para probarlo a mano.
  searxng:
    image: searxng/searxng:2026.10.27-b5ed73fcb
    restart: unless-stopped
    profiles: ["searxng"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-cambia-esto}
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_PUERTO:-8888}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${SEARXNG_PUERTO:-8888}:8080"

  # IA local (opcional): docker compose --profile ollama up -d
  # Luego descarga un modelo:  docker compose exec ollama ollama pull <modelo>
  # y en .env: DOCUBOT_IA__PROVEEDOR=ollama  DOCUBOT_IA__MODELO=<modelo>
  ollama:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    # Con tarjeta NVIDIA (y NVIDIA Container Toolkit), quita los comentarios:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  pruebas:
    <<: *backend
    build:
      context: ./backend
      target: pruebas
    image: docubot-pruebas:local
    restart: "no"
    profiles: ["pruebas"]
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    volumes:
      - ./config:/app/config:ro
      - ./ejemplos:/app/ejemplos:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
  modelos:
