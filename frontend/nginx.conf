server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 50m;

    # DNS interno de Docker: se vuelve a resolver "api" si su contenedor se recrea
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # API y eventos en vivo (WebSocket) van al backend
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
    }

    # módulos .mjs (el worker del visor de PDF): los navegadores exigen tipo JavaScript
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # archivos con huella en el nombre: caché larga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # aplicación de una sola página
    location / {
        try_files $uri /index.html;
    }
}
